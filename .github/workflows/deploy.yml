name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # Optional: Define the environment for deployment

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          script: |
            echo "📁 Navigating to project directory..."
            cd /var/www/rasa-borneo

            echo "🔐 Marking directory as safe for Git..."
            git config --global --add safe.directory /var/www/rasa-borneo

            echo "🔄 Resetting local changes..."
            git reset --hard
            git clean -fd

            echo "📥 Pulling latest code from master branch..."
            git pull origin master

            echo "🧩 Fixing ownership and permissions..."
            sudo chown -R $USER:$USER /var/www/rasa-borneo
            sudo chmod -R 755 /var/www/rasa-borneo

            echo "📦 Installing backend dependencies (Laravel)..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "🔧 Running Laravel optimizations..."
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link

            echo "⚙️ Building frontend assets..."
            npm run build

            echo "✅ Deployment finished successfully!"
